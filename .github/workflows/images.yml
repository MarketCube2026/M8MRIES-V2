name: Build versioned containers

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  images:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [api, ocr]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Registry namespace
        run: echo "IMAGE_OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.service == 'ocr' && 'ocr_server/Dockerfile' || 'Dockerfile' }}
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ env.IMAGE_OWNER }}/approval-${{ matrix.service }}:${{ github.sha }}

      - name: Export image
        shell: bash
        run: |
          set -euo pipefail
          IMAGE="ghcr.io/${IMAGE_OWNER}/approval-${{ matrix.service }}:${GITHUB_SHA}"
          docker pull --platform linux/amd64 "$IMAGE"
          docker save "$IMAGE" | gzip > approval-${{ matrix.service }}.tar.gz
          sha256sum approval-${{ matrix.service }}.tar.gz > approval-${{ matrix.service }}.tar.gz.sha256
          printf '%s\n' "$IMAGE" > approval-${{ matrix.service }}-reference.txt

      - name: Upload image archive
        uses: actions/upload-artifact@v4
        with:
          name: approval-${{ matrix.service }}-offline-${{ github.sha }}
          path: |
            approval-${{ matrix.service }}.tar.gz
            approval-${{ matrix.service }}.tar.gz.sha256
            approval-${{ matrix.service }}-reference.txt
          compression-level: 0
          retention-days: 3
          if-no-files-found: error
